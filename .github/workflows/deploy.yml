name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy changed files via webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git ls-files)
          fi

          echo "Files to deploy:"
          echo "$CHANGED"

          FAILED=0

          for file in $CHANGED; do
            case "$file" in
              .git*|.github*|server.py|inject-biz-months.js|data.json|config.json|expenses/config.php|expenses/uploads/*|"")
                echo "Skipping: $file"
                continue
                ;;
            esac

            [ -f "$file" ] || { echo "Skipping (deleted): $file"; continue; }

            echo "--- Deploying: $file"
            tmpjson=$(mktemp)
            FILE="$file" DEPLOY_TOKEN="$DEPLOY_TOKEN" python3 -c "import json,os; f=os.environ['FILE']; c=open(f,encoding='utf-8').read(); print(json.dumps({'token':os.environ['DEPLOY_TOKEN'],'file':f,'content':c}))" > "$tmpjson"

            if response=$(curl -sf --max-time 90 -X POST \
                 -H "Content-Type: application/json" \
                 --data-binary "@$tmpjson" \
                 "https://tracker.mydocta.com/_deploy.php" 2>&1); then
              echo "OK: $file — $response"
            else
              echo "ERROR: deploy failed for $file — $response"
              FAILED=1
            fi
            rm -f "$tmpjson"
          done

          echo ""
          echo "===== VERIFY ====="
          if [ -f WealthTrack.html ]; then
            served=$(curl -s --max-time 60 -o /dev/null -w "%{size_download}" "https://tracker.mydocta.com/WealthTrack.html?cb=$RANDOM" || echo 0)
            echo "Server: $served bytes | Local: $(wc -c < WealthTrack.html) bytes"
          fi

          [ $FAILED -eq 0 ] || { echo "One or more files failed!"; exit 1; }
          echo "Deploy complete."
