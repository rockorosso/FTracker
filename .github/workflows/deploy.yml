name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bootstrap _deploy.php via FTP (new file, creates once)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git ls-files)
          fi
          if echo "$CHANGED" | grep -q '_deploy.php'; then
            echo "Uploading _deploy.php via FTP..."
            # FTP root = home dir; public_html/ prefix puts it in the web root
            curl --silent --show-error \
              -T "_deploy.php" \
              "ftp://$FTP_HOST/public_html/_deploy.php" \
              --user "$FTP_USER:$FTP_PASS" \
              && echo "OK: _deploy.php" \
              || echo "WARNING: FTP upload failed (file may already exist — webhook will self-update it)"
          fi

      - name: Deploy changed files via webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git ls-files)
          fi

          echo "Files to deploy:"
          echo "$CHANGED"

          FAILED=0

          for file in $CHANGED; do
            # Skip sensitive / excluded files and _deploy.php (handled by FTP step)
            case "$file" in
              .git*|.github*|server.py|inject-biz-months.js|data.json|config.json|expenses/config.php|expenses/uploads/*|_deploy.php|"")
                echo "Skipping: $file"
                continue
                ;;
            esac

            if [ ! -f "$file" ]; then
              echo "Skipping (deleted): $file"
              continue
            fi

            echo "Deploying via webhook: $file"

            # Build JSON payload (single-line Python to avoid YAML indentation issues)
            tmpjson=$(mktemp)
            FILE="$file" DEPLOY_TOKEN="$DEPLOY_TOKEN" python3 -c "import json,os; f=os.environ['FILE']; c=open(f,encoding='utf-8').read(); print(json.dumps({'token':os.environ['DEPLOY_TOKEN'],'file':f,'content':c}))" > "$tmpjson"

            response=$(curl -sf -X POST \
              -H "Content-Type: application/json" \
              --data-binary "@$tmpjson" \
              "https://tracker.mydocta.com/_deploy.php" 2>&1)
            rm -f "$tmpjson"

            if [ $? -eq 0 ]; then
              echo "OK: $file — $response"
            else
              echo "ERROR: Failed to deploy $file — $response"
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "One or more files failed to deploy!"
            exit 1
          fi

          echo "Deploy complete."
